<div [ngClass]="{ 'show-nav': showNav }">
<div class="overlay"></div>
  <nav class="nav">
    <div class="toggle" (click)="toggleWhosthatpokemonDrawer()">
      <span class="toggler" (click)="toggleWhosthatpokemonDrawer()">{{arrow}}</span>
    </div>
     <app-wtp></app-wtp>
  </nav>


<div class="homeContainer">
  <div class="leftV">
    <app-pokemon-details></app-pokemon-details>
  </div>
  <div class="rightV">
   
    <div class="searchFilterBar">
      <div class="filterContainer">
        <mat-form-field class="pokemonSearch"
          appearance="outline"
          floatLabel="always"
        >
          <input
            type="text"
            matInput
            [formControl]="searchControl"
            [matAutocomplete]="auto"
            spellcheck="false"
            placeholder="Search your Pokemon!"
          />
          <mat-icon matTextPrefix (click)="this.onEnter(this.searchControl.value)">search</mat-icon>
          <mat-autocomplete #auto="matAutocomplete">
            <mat-option
              class="flexOption"
              *ngFor="let option of filteredOptions | async"
              [value]="option"
            >
              {{ option }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>
      <div class="filterBtn" (click)="toggleFilter()">
        <mat-icon
          >filter_list</mat-icon
        >
        <span
          class="filterCount"
          *ngIf="selectionList && selectionList.length > 0"
          >+{{ selectionList.length }}</span
        >
      </div>
      <mat-select
        #pokemonFilter
        class="hiddenFilter"
        (selectionChange)="onFilterChange($event)"
        placeholder="Pokemon Type"
        multiple
      >
        <mat-option class="flexOption" [value]="'legendary'">
          <div class="optionsIconContainer">
            <img class="statIcon" src="/assets/svg/legendary.svg" />
            <div>Legendary</div>
          </div>
        </mat-option>
        <mat-option class="flexOption" [value]="'mythical'">
          <div class="optionsIconContainer">
            <img class="statIcon" src="/assets/svg/mythical.svg" />
            <div>Mythical</div>
          </div>
        </mat-option>
        <mat-option
          class="flexOption"
          *ngFor="let type of typeIconMappingList"
          [value]="type"
        >
          <div class="optionsIconContainer">
            <img
              class="statIcon"
              [src]="typeIconMapping[type]"
              [matTooltip]="type"
            />
            <div>{{ type | titlecase }}</div>
          </div>
        </mat-option>
      </mat-select>
    </div>

    <div class="listPaginatorContainer">
      <div class="listContainer">
        <ng-container *ngFor="let pokeData of viewPokeData">
          
           <app-pokemon-card
            class="abcd"
            [pokemonData]="pokeData"
            [ListOfPokeData]="viewPokeData"
          ></app-pokemon-card>
          <!-- <app-avataar [pokemonData]="pokeData"></app-avataar> -->
        
         
        </ng-container>
      </div>
      <div class="paginatorContainer">
        <mat-paginator
          [length]="this.totalPokeDocs"
          [pageSize]="pageSize"
          [pageSizeOptions]="[12, 50, 100]"
          aria-label="Select page"
          (page)="onPageChange($event)"
        ></mat-paginator>
      </div>
    </div>
  </div>
  
    
  
  
</div>
</div>
<app-pokeball-spinner></app-pokeball-spinner>
